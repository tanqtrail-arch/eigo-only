<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eigo Only! - 英語なぞときクイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 紙吹雪コンテナ -->
  <div id="confetti-container" class="confetti-container"></div>
  <!-- コンボポップアップ -->
  <div id="combo-popup" class="combo-popup"></div>

  <div id="app">
    <!-- Start Screen -->
    <div id="screen-start" class="screen active">
      <h1 class="title">Eigo Only!</h1>
      <p class="subtitle">英語のヒントを読んで、答えを当てよう</p>
      <div class="rules">
        <p>ルール</p>
        <ul>
          <li>ヒント1だけで答えると 300pt！</li>
          <li>ヒントを開くほどポイントが下がるよ（200pt → 100pt）</li>
          <li>連続正解でコンボ倍率UP！（x1.2 → x1.5 → x2.0）</li>
          <li>30秒以内に答えよう！残り秒数がボーナスに</li>
          <li>間違えた問題は復習モードで再挑戦！</li>
        </ul>
      </div>

      <!-- レベル選択 -->
      <div class="level-select">
        <p class="level-select-title">レベルを選ぼう</p>
        <div class="level-buttons" id="level-buttons"></div>
      </div>
    </div>

    <!-- Quiz Screen -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <span id="quiz-progress">Q1 / 7</span>
        <span id="quiz-mode" class="quiz-mode" style="display:none">復習モード</span>
        <span id="quiz-level" class="quiz-level" style="display:none"></span>
        <span id="combo-display" class="combo-display" style="display:none"></span>
        <span id="quiz-score">Score: 0</span>
      </div>
      <div id="quiz-timer" class="quiz-timer"></div>
      <div class="hint-points-bar">
        <span id="hint-points">いま答えると 300pt</span>
      </div>
      <ul id="question-list" class="question-list"></ul>
      <div id="choices" class="choices"></div>
    </div>

    <!-- Result per question -->
    <div id="screen-answer" class="screen">
      <div id="answer-result" class="answer-result"></div>
      <div id="answer-detail" class="answer-detail"></div>
      <button id="btn-next" class="btn btn-primary">次の問題へ</button>
    </div>

    <!-- Final Score Screen -->
    <div id="screen-final" class="screen">
      <h2 id="final-title-text" class="final-title">結果発表</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-titles" class="final-titles" style="display:none"></div>
      <div id="final-breakdown" class="final-breakdown"></div>
      <div id="final-ranking" class="final-ranking" style="display:none"></div>
      <button id="btn-review-final" class="btn btn-review" style="display:none">間違えた問題を復習する</button>
      <button id="btn-retry" class="btn btn-primary">もう一度遊ぶ</button>
      <button id="btn-back-home" class="btn btn-secondary">レベル選択に戻る</button>
    </div>
  </div>

  <script src="js/questionMaster.js"></script>
  <script src="js/gameMaster.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
