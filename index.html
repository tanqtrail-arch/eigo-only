<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eigo Only! - 英語クイズゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Start Screen -->
    <div id="screen-start" class="screen active">
      <h1 class="title">Eigo Only!</h1>
      <p class="subtitle">英語の質問文を読んで、答えを当てよう</p>
      <div class="rules">
        <p>ルール</p>
        <ul>
          <li>英語の質問文を3つ読んで、それが何かを当てます</li>
          <li>質問文はすべて中学英語レベルです</li>
          <li>回答後、和訳とポイント英単語を確認できます</li>
          <li>間違えた問題は復習モードで再挑戦！</li>
        </ul>
      </div>
      <button id="btn-start" class="btn btn-primary">スタート</button>
      <button id="btn-review" class="btn btn-review" style="display:none">復習する</button>
    </div>

    <!-- Quiz Screen -->
    <div id="screen-quiz" class="screen">
      <div class="quiz-header">
        <span id="quiz-progress">Q1 / 7</span>
        <span id="quiz-mode" class="quiz-mode" style="display:none">復習モード</span>
        <span id="quiz-score">Score: 0</span>
      </div>
      <div class="question-prompt">この3つの質問に答えられるものは？</div>
      <ul id="question-list" class="question-list"></ul>
      <div id="choices" class="choices"></div>
    </div>

    <!-- Result per question -->
    <div id="screen-answer" class="screen">
      <div id="answer-result" class="answer-result"></div>
      <div id="answer-detail" class="answer-detail"></div>
      <button id="btn-next" class="btn btn-primary">次の問題へ</button>
    </div>

    <!-- Final Score Screen -->
    <div id="screen-final" class="screen">
      <h2 id="final-title-text" class="final-title">結果発表</h2>
      <div id="final-score" class="final-score"></div>
      <div id="final-breakdown" class="final-breakdown"></div>
      <button id="btn-review-final" class="btn btn-review" style="display:none">間違えた問題を復習する</button>
      <button id="btn-retry" class="btn btn-primary">もう一度遊ぶ</button>
    </div>
  </div>

  <script src="js/questionMaster.js"></script>
  <script src="js/gameMaster.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
